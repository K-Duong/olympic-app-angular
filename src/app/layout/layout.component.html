<div class="grid">
  @if (headerMetadata$ | async; as headerMetadata) {
    <app-header class="aside"
                [title]="headerMetadata.title"
                [indicators]="headerMetadata.indicators"
    />
  }
  <main class="main">
    @if (isNavigating$ | async) {
      <app-loader message="Loading page…" />
    }
    <router-outlet></router-outlet>
  </main>
</div>
